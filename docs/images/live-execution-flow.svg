<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="650" viewBox="0 0 1440 650" role="img" aria-labelledby="title desc">
  <title id="title">Guarded live signal and execution flow</title>
  <desc id="desc">Timeline showing a completed futures bar becoming a strategy signal, passing context, reconciliation, and risk checks, then becoming a dry-run preview, paper or demo order, or separately approved live order.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111d"/>
      <stop offset="1" stop-color="#0b1725"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L0 6 L9 3 z" fill="#64748b"/>
    </marker>
    <marker id="green-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L0 6 L9 3 z" fill="#34d399"/>
    </marker>
    <marker id="red-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L0 6 L9 3 z" fill="#fb7185"/>
    </marker>
    <style>
      .title{fill:#f8fafc;font:700 34px Arial,sans-serif}
      .subtitle{fill:#94a3b8;font:15px Arial,sans-serif}
      .step{fill:#101d2c;stroke:#33475c;stroke-width:1.5}
      .signal{fill:#102a2a;stroke:#2dd4bf;stroke-width:1.5}
      .guard{fill:#2e2413;stroke:#f59e0b;stroke-width:1.5}
      .label{fill:#e2e8f0;font:700 15px Arial,sans-serif}
      .body{fill:#cbd5e1;font:13px Arial,sans-serif}
      .tiny{fill:#94a3b8;font:12px Arial,sans-serif}
      .cap{font:700 12px Arial,sans-serif;letter-spacing:1.5px}
      .line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
      .green{fill:none;stroke:#34d399;stroke-width:2.4;marker-end:url(#green-arrow)}
      .red{fill:none;stroke:#fb7185;stroke-width:2;marker-end:url(#red-arrow)}
      .dash{fill:none;stroke:#475569;stroke-width:1.5;stroke-dasharray:5 6}
    </style>
  </defs>

  <rect width="1440" height="650" fill="url(#bg)"/>
  <text x="52" y="58" class="title">What happens when a live bar produces a signal</text>
  <text x="52" y="87" class="subtitle">The completed close is a risk reference. It is never presented as a guaranteed next-open fill.</text>

  <line x1="92" y1="280" x2="1348" y2="280" stroke="#25374b" stroke-width="4"/>

  <g>
    <circle cx="118" cy="280" r="15" fill="#38bdf8"/>
    <rect x="52" y="128" width="200" height="118" rx="16" class="step"/>
    <text x="70" y="153" class="cap" fill="#38bdf8">1 · BAR BOUNDARY</text>
    <text x="70" y="181" class="label">Minute t completes</text>
    <text x="70" y="204" class="body">Databento publishes the</text>
    <text x="70" y="224" class="body">aggregate at boundary t+1</text>
    <path d="M118 246 V263" class="line"/>

    <circle cx="354" cy="280" r="15" fill="#2dd4bf"/>
    <rect x="278" y="314" width="210" height="126" rx="16" class="signal"/>
    <text x="298" y="340" class="cap" fill="#5eead4">2 · STRATEGY</text>
    <text x="298" y="368" class="label">Completed-bar update</text>
    <text x="298" y="391" class="body">levels + displacement</text>
    <text x="298" y="411" class="body">FVG sequence → TradeSignal</text>
    <path d="M354 297 V314" class="line"/>

    <circle cx="604" cy="280" r="15" fill="#f59e0b"/>
    <rect x="520" y="128" width="216" height="118" rx="16" class="guard"/>
    <text x="540" y="153" class="cap" fill="#fbbf24">3 · PREPARE</text>
    <text x="540" y="181" class="label">Build the route</text>
    <text x="540" y="204" class="body">optional context + proxy</text>
    <text x="540" y="224" class="body">chain select or contract map</text>
    <path d="M604 246 V263" class="line"/>

    <circle cx="858" cy="280" r="15" fill="#f59e0b"/>
    <rect x="772" y="314" width="224" height="126" rx="16" class="guard"/>
    <text x="792" y="340" class="cap" fill="#fbbf24">4 · VERIFY</text>
    <text x="792" y="368" class="label">Broker truth + risk</text>
    <text x="792" y="391" class="body">snapshot → reconcile → limits</text>
    <text x="792" y="411" class="body">recheck end-to-end freshness</text>
    <path d="M858 297 V314" class="line"/>

    <circle cx="1110" cy="280" r="15" fill="#34d399"/>
    <rect x="1022" y="128" width="232" height="118" rx="16" class="signal"/>
    <text x="1042" y="153" class="cap" fill="#6ee7b7">5 · MODE GATE</text>
    <text x="1042" y="181" class="label">Choose allowed action</text>
    <text x="1042" y="204" class="body">dry-run · paper/demo · live</text>
    <text x="1042" y="224" class="body">live needs two confirmations</text>
    <path d="M1110 246 V263" class="line"/>

    <circle cx="1330" cy="280" r="15" fill="#a78bfa"/>
    <rect x="1270" y="314" width="126" height="126" rx="16" fill="#251b36" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="1290" y="340" class="cap" fill="#c4b5fd">6 · RESULT</text>
    <text x="1290" y="369" class="label">Order intent</text>
    <text x="1290" y="393" class="body">preview or</text>
    <text x="1290" y="413" class="body">submission</text>
    <path d="M1330 297 V314" class="line"/>
  </g>

  <path d="M133 280 H339" class="green"/>
  <path d="M369 280 H589" class="green"/>
  <path d="M619 280 H843" class="green"/>
  <path d="M873 280 H1095" class="green"/>
  <path d="M1125 280 H1315" class="green"/>

  <g>
    <rect x="52" y="486" width="404" height="120" rx="18" fill="#111c2a" stroke="#334155" stroke-width="1.5"/>
    <text x="74" y="515" class="cap" fill="#94a3b8">MODE ACTIONS</text>
    <rect x="74" y="536" width="108" height="44" rx="12" fill="#102b2a" stroke="#34d399"/>
    <text x="128" y="554" class="label" text-anchor="middle">DRY-RUN</text>
    <text x="128" y="571" class="tiny" text-anchor="middle">preview only</text>
    <rect x="194" y="536" width="112" height="44" rx="12" fill="#15273a" stroke="#38bdf8"/>
    <text x="250" y="554" class="label" text-anchor="middle">PAPER</text>
    <text x="250" y="571" class="tiny" text-anchor="middle">paper / demo</text>
    <rect x="318" y="536" width="114" height="44" rx="12" fill="#33171c" stroke="#fb7185"/>
    <text x="375" y="554" class="label" text-anchor="middle">LIVE</text>
    <text x="375" y="571" class="tiny" text-anchor="middle">config + CLI opt-in</text>
  </g>

  <g>
    <rect x="482" y="486" width="430" height="120" rx="18" fill="#111c2a" stroke="#334155" stroke-width="1.5"/>
    <text x="504" y="515" class="cap" fill="#94a3b8">AFTER ENTRY</text>
    <rect x="504" y="536" width="180" height="44" rx="12" fill="#241b35" stroke="#a78bfa"/>
    <text x="594" y="554" class="label" text-anchor="middle">Alpaca options</text>
    <text x="594" y="571" class="tiny" text-anchor="middle">runtime synthetic exits</text>
    <rect x="704" y="536" width="184" height="44" rx="12" fill="#12253a" stroke="#38bdf8"/>
    <text x="796" y="554" class="label" text-anchor="middle">Tradovate futures</text>
    <text x="796" y="571" class="tiny" text-anchor="middle">broker-hosted bracket</text>
  </g>

  <g>
    <rect x="938" y="486" width="458" height="120" rx="18" fill="#25161c" stroke="#fb7185" stroke-width="1.5"/>
    <text x="960" y="515" class="cap" fill="#fda4af">ANY FAILED CHECK</text>
    <text x="960" y="544" class="label">No new order</text>
    <text x="960" y="567" class="body">Expected rejection → log and keep monitoring</text>
    <text x="960" y="587" class="body">Unexpected error or critical drift → persistent halt</text>
  </g>

  <path d="M858 440 C858 464 1002 458 1002 486" class="red"/>
  <text x="52" y="634" class="tiny">ExecutionStore persists tracked trades and the kill switch. Reconciliation continuously compares that local ledger with broker-authoritative orders and positions.</text>
</svg>
