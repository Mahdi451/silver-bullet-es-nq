<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Bearish Silver Bullet setup with entry, stop, scale-out, and DOL exit</title>
  <desc id="desc">Bearish NQ concept chart showing displacement, two fair value gaps, next-minute entry, one-tick-beyond stop, 50 percent scale-out at five points, and PDL draw-on-liquidity target with at least ten points of delivery.</desc>
  <defs>
    <style>
      .bg{fill:#0b1120}
      .panel{fill:#111827;stroke:#243244;stroke-width:1.5}
      .header{fill:#151f2e}
      .grid{stroke:#223047;stroke-width:1}
      .axis{stroke:#334155;stroke-width:1.5}
      .wick{stroke:#64748b;stroke-width:2;stroke-linecap:round}
      .up{fill:#22c55e}
      .down{fill:#ef4444}
      .text{fill:#f8fafc;font-family:Arial,sans-serif}
      .muted{fill:#94a3b8;font-family:Arial,sans-serif}
      .label{fill:#cbd5e1;font-family:Arial,sans-serif}
      .plan{fill:#0f172a;stroke:#334155;stroke-width:1.5}
      .planText{fill:#e2e8f0;font-family:Arial,sans-serif;font-size:12}
      .planMuted{fill:#94a3b8;font-family:Arial,sans-serif;font-size:11}
    </style>
    <marker id="arrowDown" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L4,8 L8,0 Z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="1200" height="680" class="bg"/>
  <rect x="56" y="48" width="1088" height="584" rx="24" class="panel"/>
  <rect x="56" y="48" width="1088" height="52" rx="24" class="header"/>
  <text x="84" y="81" class="text" font-size="18" font-weight="700">Bearish Silver Bullet Setup</text>
  <text x="1120" y="81" class="muted" font-size="13" text-anchor="end">NQ example · NY PM session</text>

  <g>
    <line x1="96" y1="150" x2="820" y2="150" class="grid"/>
    <line x1="96" y1="220" x2="820" y2="220" class="grid"/>
    <line x1="96" y1="290" x2="820" y2="290" class="grid"/>
    <line x1="96" y1="360" x2="820" y2="360" class="grid"/>
    <line x1="96" y1="430" x2="820" y2="430" class="grid"/>
    <line x1="96" y1="120" x2="96" y2="470" class="axis"/>
    <line x1="96" y1="470" x2="820" y2="470" class="axis"/>
  </g>

  <g stroke-dasharray="8 7" stroke-width="2">
    <line x1="96" y1="132" x2="820" y2="132" stroke="#ef4444"/>
    <line x1="96" y1="148" x2="820" y2="148" stroke="#64748b"/>
    <line x1="96" y1="246" x2="820" y2="246" stroke="#fbbf24"/>
    <line x1="96" y1="272" x2="820" y2="272" stroke="#a78bfa"/>
    <line x1="96" y1="438" x2="820" y2="438" stroke="#38bdf8"/>
  </g>

  <rect x="828" y="118" width="118" height="28" rx="7" fill="#991b1b"/>
  <text x="887" y="137" fill="#fee2e2" font-family="Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle">STOP</text>
  <text x="887" y="124" fill="#fecaca" font-family="Arial,sans-serif" font-size="11" text-anchor="middle">18105.25 (+1 tick)</text>

  <rect x="828" y="134" width="118" height="28" rx="7" fill="#334155"/>
  <text x="887" y="153" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle">ORIGIN SWING</text>
  <text x="887" y="140" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="11" text-anchor="middle">18105.00</text>

  <rect x="828" y="232" width="118" height="28" rx="7" fill="#713f12"/>
  <text x="887" y="251" fill="#fef3c7" font-family="Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle">ENTRY</text>
  <text x="887" y="238" fill="#fde68a" font-family="Arial,sans-serif" font-size="11" text-anchor="middle">18078.00 next 1m</text>

  <rect x="828" y="258" width="118" height="28" rx="7" fill="#5b21b6"/>
  <text x="887" y="277" fill="#ede9fe" font-family="Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle">SCALE-OUT 50%</text>
  <text x="887" y="264" fill="#c4b5fd" font-family="Arial,sans-serif" font-size="11" text-anchor="middle">18073.00 (-5)</text>

  <rect x="828" y="424" width="118" height="28" rx="7" fill="#0e7490"/>
  <text x="887" y="443" fill="#ecfeff" font-family="Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle">TARGET PDL</text>
  <text x="887" y="430" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="11" text-anchor="middle">18045.00</text>

  <g>
    <line x1="150" y1="168" x2="150" y2="234" class="wick"/><rect x="140" y="188" width="20" height="30" rx="3" class="up"/>
    <line x1="210" y1="180" x2="210" y2="250" class="wick"/><rect x="200" y="200" width="20" height="32" rx="3" class="down"/>
    <line x1="270" y1="160" x2="270" y2="232" class="wick"/><rect x="260" y="180" width="20" height="34" rx="3" class="down"/>
    <line x1="330" y1="190" x2="330" y2="266" class="wick"/><rect x="320" y="212" width="20" height="34" rx="3" class="up"/>
    <line x1="390" y1="214" x2="390" y2="294" class="wick"/><rect x="380" y="236" width="20" height="38" rx="3" class="down"/>
    <line x1="450" y1="270" x2="450" y2="370" class="wick"/><rect x="440" y="296" width="20" height="56" rx="3" class="down"/>
    <line x1="510" y1="308" x2="510" y2="400" class="wick"/><rect x="500" y="332" width="20" height="44" rx="3" class="down"/>
    <line x1="570" y1="276" x2="570" y2="362" class="wick"/><rect x="560" y="300" width="20" height="38" rx="3" class="up"/>
    <line x1="630" y1="308" x2="630" y2="398" class="wick"/><rect x="620" y="332" width="20" height="40" rx="3" class="down"/>
    <line x1="690" y1="344" x2="690" y2="424" class="wick"/><rect x="680" y="364" width="20" height="40" rx="3" class="down"/>
    <line x1="750" y1="368" x2="750" y2="440" class="wick"/><rect x="740" y="386" width="20" height="36" rx="3" class="down"/>
  </g>

  <rect x="430" y="254" width="98" height="34" rx="8" fill="#dc2626" opacity="0.22" stroke="#ef4444" stroke-width="1.5"/>
  <text x="479" y="234" fill="#fca5a5" font-family="Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle">FVG 1</text>
  <text x="479" y="248" fill="#fca5a5" font-family="Arial,sans-serif" font-size="10" text-anchor="middle">mitigated</text>

  <rect x="612" y="314" width="98" height="34" rx="8" fill="#dc2626" opacity="0.22" stroke="#ef4444" stroke-width="1.5"/>
  <text x="661" y="294" fill="#fca5a5" font-family="Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle">FVG 2</text>
  <text x="661" y="308" fill="#fca5a5" font-family="Arial,sans-serif" font-size="10" text-anchor="middle">entry trigger</text>

  <rect x="444" y="296" width="30" height="58" rx="4" fill="#ef4444" opacity="0.18" stroke="#ef4444"/>
  <text x="479" y="288" fill="#fca5a5" font-family="Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle">displacement</text>

  <circle cx="722" cy="246" r="7" fill="#fbbf24"/>
  <line x1="722" y1="132" x2="722" y2="246" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4 6"/>

  <path d="M722 246 L722 452 L800 452" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowDown)"/>
  <text x="804" y="456" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="11" font-weight="700">-33 pts to DOL</text>

  <rect x="96" y="500" width="700" height="108" rx="16" class="plan"/>
  <text x="118" y="526" class="text" font-size="14" font-weight="700">Trade plan</text>
  <text x="118" y="548" class="planText">1. Target untapped PDL with at least 10 points of delivery from the origin swing.</text>
  <text x="118" y="568" class="planText">2. Enter short at the next 1-minute open after FVG 2 forms inside the session.</text>
  <text x="118" y="588" class="planText">3. Stop at origin swing plus one tick. Scale out 50% at -5 points. Exit remainder at PDL or forced 3:59 PM close.</text>

  <rect x="820" y="500" width="300" height="108" rx="16" class="plan"/>
  <text x="842" y="526" class="text" font-size="14" font-weight="700">Levels</text>
  <text x="842" y="548" class="planMuted">Delivery</text><text x="980" y="548" class="planText">33.0 pts (meets 10 pt minimum)</text>
  <text x="842" y="568" class="planMuted">Risk</text><text x="980" y="568" class="planText">27.25 pts entry to stop</text>
  <text x="842" y="588" class="planMuted">Reward</text><text x="980" y="588" class="planText">33.0 pts to PDL DOL</text>
</svg>
