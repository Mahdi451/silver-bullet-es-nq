<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
  <title id="title">Bearish Silver Bullet setup</title>
  <desc id="desc">Bearish setup concept showing displacement toward downside liquidity, first FVG, mitigation, second FVG, next-minute entry, stop, scale out, and target.</desc>
  <rect width="1100" height="500" fill="#0b1220"/>
  <rect x="60" y="52" width="980" height="380" rx="22" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="84" y="94" fill="#f8fafc" font-family="Arial, sans-serif" font-size="28" font-weight="700">Bearish Setup Sequence</text>
  <text x="84" y="124" fill="#94a3b8" font-family="Arial, sans-serif" font-size="16">Target downside liquidity, confirm displacement, wait for mitigation, trigger on the second bearish FVG</text>

  <line x1="100" y1="145" x2="990" y2="145" stroke="#ef4444" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="820" y="134" fill="#fecaca" font-family="Arial, sans-serif" font-size="15" font-weight="700">Stop beyond origin swing</text>
  <line x1="100" y1="355" x2="990" y2="355" stroke="#38bdf8" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="842" y="380" fill="#7dd3fc" font-family="Arial, sans-serif" font-size="15" font-weight="700">Downside DOL target</text>

  <polyline points="110,175 170,190 230,168 290,205 350,186 410,248 470,295 530,268 590,224 650,250 710,294 770,320 830,342 900,355" fill="none" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="410" cy="248" r="8" fill="#ef4444"/>
  <circle cx="590" cy="224" r="8" fill="#f59e0b"/>
  <circle cx="710" cy="294" r="8" fill="#ef4444"/>
  <circle cx="770" cy="320" r="8" fill="#a78bfa"/>

  <rect x="390" y="230" width="96" height="42" rx="9" fill="#dc2626" opacity="0.35" stroke="#ef4444"/>
  <text x="401" y="256" fill="#fecaca" font-family="Arial, sans-serif" font-size="13" font-weight="700">First FVG</text>
  <rect x="676" y="238" width="100" height="42" rx="9" fill="#dc2626" opacity="0.35" stroke="#ef4444"/>
  <text x="686" y="264" fill="#fecaca" font-family="Arial, sans-serif" font-size="13" font-weight="700">Second FVG</text>

  <path d="M410 248 C430 310 476 324 530 295" fill="none" stroke="#ef4444" stroke-width="3" marker-end="url(#red-arrow)"/>
  <text x="360" y="334" fill="#fecaca" font-family="Arial, sans-serif" font-size="14" font-weight="700">1. Displacement</text>
  <path d="M530 268 C558 225 574 214 590 224" fill="none" stroke="#f59e0b" stroke-width="3" marker-end="url(#orange-arrow)"/>
  <text x="510" y="190" fill="#fde68a" font-family="Arial, sans-serif" font-size="14" font-weight="700">2. Mitigation</text>
  <path d="M710 294 C728 308 748 318 770 320" fill="none" stroke="#a78bfa" stroke-width="3" marker-end="url(#purple-arrow)"/>
  <text x="690" y="352" fill="#ddd6fe" font-family="Arial, sans-serif" font-size="14" font-weight="700">3. Entry next open</text>

  <rect x="95" y="446" width="265" height="34" rx="17" fill="#1e293b" stroke="#334155"/>
  <text x="118" y="468" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="14">Scale out: +5 points, 50 percent</text>
  <rect x="392" y="446" width="265" height="34" rx="17" fill="#1e293b" stroke="#334155"/>
  <text x="414" y="468" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="14">Final exit: selected liquidity target</text>
  <rect x="690" y="446" width="315" height="34" rx="17" fill="#1e293b" stroke="#334155"/>
  <text x="712" y="468" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="14">Invalidation: target tapped, stop crossed, or session ends</text>

  <defs>
    <marker id="red-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ef4444"/>
    </marker>
    <marker id="orange-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#f59e0b"/>
    </marker>
    <marker id="purple-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#a78bfa"/>
    </marker>
  </defs>
</svg>
