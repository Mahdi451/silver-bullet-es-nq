<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Bearish Silver Bullet setup</title>
  <desc id="desc">Minimal bearish setup chart with downside target, stop, two fair value gaps, and entry marker.</desc>
  <defs>
    <style>
      .bg{fill:#0b1120}
      .panel{fill:#111827;stroke:#243244;stroke-width:1.5}
      .header{fill:#151f2e}
      .grid{stroke:#223047;stroke-width:1}
      .axis{stroke:#334155;stroke-width:1.5}
      .wick{stroke:#64748b;stroke-width:2;stroke-linecap:round}
      .up{fill:#22c55e}
      .down{fill:#ef4444}
      .text{fill:#f8fafc;font-family:Arial,sans-serif}
      .muted{fill:#94a3b8;font-family:Arial,sans-serif}
    </style>
  </defs>
  <rect width="1200" height="560" class="bg"/>
  <rect x="70" y="54" width="1060" height="430" rx="24" class="panel"/>
  <rect x="70" y="54" width="1060" height="52" rx="24" class="header"/>
  <text x="98" y="87" class="text" font-size="18" font-weight="700">Bearish Silver Bullet Setup</text>
  <text x="1098" y="87" class="muted" font-size="13" text-anchor="end">stop above, target below</text>

  <g>
    <line x1="112" y1="165" x2="1056" y2="165" class="grid"/>
    <line x1="112" y1="245" x2="1056" y2="245" class="grid"/>
    <line x1="112" y1="325" x2="1056" y2="325" class="grid"/>
    <line x1="112" y1="405" x2="1056" y2="405" class="grid"/>
    <line x1="112" y1="125" x2="112" y2="442" class="axis"/>
    <line x1="112" y1="442" x2="1056" y2="442" class="axis"/>
  </g>

  <g stroke-dasharray="8 7" stroke-width="2">
    <line x1="112" y1="150" x2="1056" y2="150" stroke="#ef4444"/>
    <line x1="112" y1="412" x2="1056" y2="412" stroke="#38bdf8"/>
  </g>
  <rect x="985" y="128" width="94" height="30" rx="8" fill="#991b1b"/>
  <text x="1032" y="148" fill="#fee2e2" font-family="Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle">STOP</text>
  <rect x="985" y="390" width="94" height="30" rx="8" fill="#0e7490"/>
  <text x="1032" y="410" fill="#ecfeff" font-family="Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle">TARGET</text>

  <g>
    <line x1="170" y1="160" x2="170" y2="226" class="wick"/><rect x="160" y="180" width="20" height="30" rx="3" class="up"/>
    <line x1="230" y1="172" x2="230" y2="242" class="wick"/><rect x="220" y="192" width="20" height="32" rx="3" class="down"/>
    <line x1="290" y1="152" x2="290" y2="224" class="wick"/><rect x="280" y="172" width="20" height="34" rx="3" class="down"/>
    <line x1="350" y1="182" x2="350" y2="258" class="wick"/><rect x="340" y="204" width="20" height="34" rx="3" class="up"/>
    <line x1="410" y1="206" x2="410" y2="286" class="wick"/><rect x="400" y="228" width="20" height="38" rx="3" class="down"/>
    <line x1="470" y1="262" x2="470" y2="362" class="wick"/><rect x="460" y="288" width="20" height="56" rx="3" class="down"/>
    <line x1="530" y1="300" x2="530" y2="392" class="wick"/><rect x="520" y="324" width="20" height="44" rx="3" class="down"/>
    <line x1="590" y1="268" x2="590" y2="354" class="wick"/><rect x="580" y="292" width="20" height="38" rx="3" class="up"/>
    <line x1="650" y1="300" x2="650" y2="390" class="wick"/><rect x="640" y="324" width="20" height="40" rx="3" class="down"/>
    <line x1="710" y1="336" x2="710" y2="416" class="wick"/><rect x="700" y="356" width="20" height="40" rx="3" class="down"/>
    <line x1="770" y1="360" x2="770" y2="432" class="wick"/><rect x="760" y="378" width="20" height="36" rx="3" class="down"/>
    <line x1="830" y1="378" x2="830" y2="442" class="wick"/><rect x="820" y="396" width="20" height="30" rx="3" class="down"/>
  </g>

  <rect x="456" y="248" width="98" height="34" rx="8" fill="#dc2626" opacity="0.22" stroke="#ef4444" stroke-width="1.5"/>
  <text x="505" y="228" fill="#fca5a5" font-family="Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle">FVG 1</text>
  <rect x="638" y="308" width="98" height="34" rx="8" fill="#dc2626" opacity="0.22" stroke="#ef4444" stroke-width="1.5"/>
  <text x="687" y="288" fill="#fca5a5" font-family="Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle">FVG 2</text>

  <line x1="742" y1="150" x2="742" y2="376" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4 6"/>
  <circle cx="742" cy="376" r="7" fill="#fbbf24"/>
  <rect x="758" y="360" width="72" height="32" rx="8" fill="#713f12"/>
  <text x="794" y="381" fill="#fef3c7" font-family="Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle">ENTRY</text>
</svg>
