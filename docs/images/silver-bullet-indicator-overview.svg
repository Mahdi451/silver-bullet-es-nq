<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Silver Bullet indicator overview</title>
  <desc id="desc">Minimal chart showing liquidity levels, the active session window, two fair value gaps, and the signal point.</desc>
  <defs>
    <style>
      .bg{fill:#0b1120}
      .panel{fill:#111827;stroke:#243244;stroke-width:1.5}
      .header{fill:#151f2e}
      .grid{stroke:#223047;stroke-width:1}
      .axis{stroke:#334155;stroke-width:1.5}
      .wick{stroke:#64748b;stroke-width:2;stroke-linecap:round}
      .up{fill:#22c55e}
      .down{fill:#ef4444}
      .text{fill:#f8fafc;font-family:Arial,sans-serif}
      .muted{fill:#94a3b8;font-family:Arial,sans-serif}
      .label{fill:#cbd5e1;font-family:Arial,sans-serif}
    </style>
  </defs>
  <rect width="1200" height="560" class="bg"/>
  <rect x="70" y="54" width="1060" height="430" rx="24" class="panel"/>
  <rect x="70" y="54" width="1060" height="52" rx="24" class="header"/>
  <text x="98" y="87" class="text" font-size="18" font-weight="700">Silver Bullet Indicator</text>
  <text x="1098" y="87" class="muted" font-size="13" text-anchor="end">clean concept view</text>

  <g>
    <line x1="112" y1="165" x2="1056" y2="165" class="grid"/>
    <line x1="112" y1="245" x2="1056" y2="245" class="grid"/>
    <line x1="112" y1="325" x2="1056" y2="325" class="grid"/>
    <line x1="112" y1="405" x2="1056" y2="405" class="grid"/>
    <line x1="112" y1="125" x2="112" y2="442" class="axis"/>
    <line x1="112" y1="442" x2="1056" y2="442" class="axis"/>
  </g>

  <rect x="470" y="125" width="315" height="317" rx="14" fill="#1e293b" opacity="0.32"/>
  <text x="492" y="153" class="label" font-size="13">active session</text>

  <g stroke-dasharray="8 7" stroke-width="2">
    <line x1="112" y1="158" x2="1056" y2="158" stroke="#38bdf8"/>
    <line x1="112" y1="402" x2="1056" y2="402" stroke="#38bdf8"/>
  </g>
  <rect x="996" y="136" width="96" height="30" rx="8" fill="#0e7490"/>
  <text x="1044" y="156" fill="#ecfeff" font-family="Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle">PDH / PWH</text>
  <rect x="996" y="380" width="96" height="30" rx="8" fill="#0e7490"/>
  <text x="1044" y="400" fill="#ecfeff" font-family="Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle">PDL / PWL</text>

  <g>
    <line x1="170" y1="328" x2="170" y2="386" class="wick"/><rect x="160" y="344" width="20" height="28" rx="3" class="down"/>
    <line x1="230" y1="306" x2="230" y2="368" class="wick"/><rect x="220" y="326" width="20" height="26" rx="3" class="up"/>
    <line x1="290" y1="286" x2="290" y2="356" class="wick"/><rect x="280" y="306" width="20" height="34" rx="3" class="up"/>
    <line x1="350" y1="302" x2="350" y2="372" class="wick"/><rect x="340" y="322" width="20" height="30" rx="3" class="down"/>
    <line x1="410" y1="274" x2="410" y2="348" class="wick"/><rect x="400" y="292" width="20" height="40" rx="3" class="up"/>
    <line x1="470" y1="222" x2="470" y2="324" class="wick"/><rect x="460" y="244" width="20" height="58" rx="3" class="up"/>
    <line x1="530" y1="198" x2="530" y2="282" class="wick"/><rect x="520" y="218" width="20" height="42" rx="3" class="up"/>
    <line x1="590" y1="226" x2="590" y2="304" class="wick"/><rect x="580" y="244" width="20" height="38" rx="3" class="down"/>
    <line x1="650" y1="244" x2="650" y2="328" class="wick"/><rect x="640" y="264" width="20" height="40" rx="3" class="down"/>
    <line x1="710" y1="214" x2="710" y2="294" class="wick"/><rect x="700" y="234" width="20" height="38" rx="3" class="up"/>
    <line x1="770" y1="184" x2="770" y2="260" class="wick"/><rect x="760" y="202" width="20" height="40" rx="3" class="up"/>
    <line x1="830" y1="166" x2="830" y2="236" class="wick"/><rect x="820" y="184" width="20" height="34" rx="3" class="up"/>
  </g>

  <rect x="456" y="304" width="98" height="34" rx="8" fill="#16a34a" opacity="0.22" stroke="#22c55e" stroke-width="1.5"/>
  <text x="505" y="363" fill="#86efac" font-family="Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle">FVG 1</text>
  <rect x="698" y="244" width="98" height="34" rx="8" fill="#16a34a" opacity="0.22" stroke="#22c55e" stroke-width="1.5"/>
  <text x="747" y="303" fill="#86efac" font-family="Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle">FVG 2</text>
  <circle cx="812" cy="184" r="7" fill="#fbbf24"/>
  <text x="832" y="189" fill="#fde68a" font-family="Arial,sans-serif" font-size="13" font-weight="700">Signal</text>
</svg>
