  <text x="78" y="126" fill="#94a3b8" font-family="Arial, sans-serif" font-size="16">ES/NQ one-minute bars with causal liquidity levels and setup state</text>

  <line x1="90" y1="170" x2="1010" y2="170" stroke="#64748b" stroke-width="1" stroke-dasharray="8 8"/>
