<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc">
  <title id="title">Silver Bullet system architecture</title>
  <desc id="desc">Architecture showing historical and live inputs, the shared deterministic strategy, guarded decision checks, Alpaca options and Tradovate futures routes, and the persistent operator safety plane.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111d"/>
      <stop offset="1" stop-color="#0b1626"/>
    </linearGradient>
    <linearGradient id="strategy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12302f"/>
      <stop offset="1" stop-color="#0d2525"/>
    </linearGradient>
    <linearGradient id="guard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#332711"/>
      <stop offset="1" stop-color="#231d12"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L0 6 L9 3 z" fill="#7890a8"/>
    </marker>
    <marker id="cyan-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L0 6 L9 3 z" fill="#38bdf8"/>
    </marker>
    <style>
      .title{fill:#f8fafc;font:700 34px Arial,sans-serif}
      .subtitle{fill:#94a3b8;font:15px Arial,sans-serif}
      .column{fill:#111d2c;stroke:#26364a;stroke-width:1.5}
      .box{fill:#0e1a29;stroke:#33475d;stroke-width:1.4}
      .strategyBox{fill:url(#strategy);stroke:#2dd4bf;stroke-width:1.5}
      .guardBox{fill:url(#guard);stroke:#f59e0b;stroke-width:1.5}
      .optionBox{fill:#241b35;stroke:#a78bfa;stroke-width:1.5}
      .futureBox{fill:#12253a;stroke:#38bdf8;stroke-width:1.5}
      .plane{fill:#101a28;stroke:#475569;stroke-width:1.5}
      .label{fill:#e2e8f0;font:700 15px Arial,sans-serif}
      .body{fill:#cbd5e1;font:13px Arial,sans-serif}
      .tiny{fill:#94a3b8;font:12px Arial,sans-serif}
      .cap{font:700 12px Arial,sans-serif;letter-spacing:1.7px}
      .line{fill:none;stroke:#7890a8;stroke-width:2;marker-end:url(#arrow)}
      .cyanLine{fill:none;stroke:#38bdf8;stroke-width:2.2;marker-end:url(#cyan-arrow)}
      .dash{fill:none;stroke:#64748b;stroke-width:1.5;stroke-dasharray:5 6}
    </style>
  </defs>

  <rect width="1440" height="800" fill="url(#background)"/>
  <circle cx="1280" cy="80" r="190" fill="#0e7490" opacity="0.06"/>
  <circle cx="150" cy="720" r="210" fill="#7c3aed" opacity="0.05"/>

  <text x="54" y="58" class="title">One strategy core, two execution routes, one safety plane</text>
  <text x="54" y="87" class="subtitle">Historical research and guarded operation share the same completed-bar and TradeSignal boundaries.</text>

  <g>
    <rect x="48" y="122" width="230" height="476" rx="20" class="column"/>
    <text x="70" y="154" class="cap" fill="#38bdf8">INPUTS</text>

    <rect x="68" y="178" width="190" height="76" rx="13" class="box"/>
    <text x="84" y="204" class="label">Historical CSV</text>
    <text x="84" y="226" class="body">Databento or Firstrate</text>
    <text x="84" y="244" class="tiny">strict one-minute OHLCV</text>

    <rect x="68" y="272" width="190" height="76" rx="13" class="box"/>
    <text x="84" y="298" class="label">Databento live</text>
    <text x="84" y="320" class="body">completed ES / NQ bars</text>
    <text x="84" y="338" class="tiny">mapping + reconnect health</text>

    <rect x="68" y="366" width="190" height="76" rx="13" class="box"/>
    <text x="84" y="392" class="label">Alpaca market data</text>
    <text x="84" y="414" class="body">SPY / QQQ proxy bars</text>
    <text x="84" y="432" class="tiny">options chains + quotes</text>

    <rect x="68" y="460" width="190" height="76" rx="13" class="box"/>
    <text x="84" y="486" class="label">Unusual Whales</text>
    <text x="84" y="508" class="body">optional flow context</text>
    <text x="84" y="526" class="tiny">never changes strategy logic</text>
  </g>

  <g>
    <rect x="310" y="122" width="310" height="476" rx="20" class="column"/>
    <text x="332" y="154" class="cap" fill="#2dd4bf">SHARED RESEARCH CORE</text>

    <rect x="334" y="178" width="262" height="82" rx="14" class="box"/>
    <text x="354" y="205" class="label">Normalize and validate</text>
    <text x="354" y="227" class="body">timezone · contracts · gaps · OHLC</text>
    <text x="354" y="246" class="tiny">both paths emit canonical Bar events</text>

    <rect x="334" y="286" width="262" height="176" rx="16" class="strategyBox"/>
    <text x="354" y="317" class="label">SilverBulletStrategy</text>
    <text x="354" y="344" class="body">1  untapped PDH / PDL / PWH / PWL</text>
    <text x="354" y="368" class="body">2  ATR displacement + swing break</text>
    <text x="354" y="392" class="body">3  first FVG → mitigation</text>
    <text x="354" y="416" class="body">4  second FVG inside session</text>
    <text x="354" y="442" class="tiny">causal state only · no provider code</text>

    <rect x="334" y="488" width="262" height="76" rx="14" class="strategyBox"/>
    <text x="354" y="516" class="label">TradeSignal</text>
    <text x="354" y="538" class="body">direction · timing · target · stop</text>
    <text x="354" y="556" class="tiny">intent, not a promised fill</text>
  </g>

  <g>
    <rect x="652" y="122" width="280" height="476" rx="20" class="column"/>
    <text x="674" y="154" class="cap" fill="#f59e0b">GUARDED DECISION</text>

    <rect x="676" y="178" width="232" height="72" rx="13" class="guardBox"/>
    <text x="696" y="205" class="label">Entry timing</text>
    <text x="696" y="228" class="body">next boundary + late rejection</text>

    <rect x="676" y="270" width="232" height="72" rx="13" class="guardBox"/>
    <text x="696" y="297" class="label">Optional context gate</text>
    <text x="696" y="320" class="body">fresh, aligned SPY / QQQ flow</text>

    <rect x="676" y="362" width="232" height="84" rx="13" class="guardBox"/>
    <text x="696" y="389" class="label">Broker truth first</text>
    <text x="696" y="412" class="body">snapshot + reconciliation</text>
    <text x="696" y="431" class="tiny">orphan/drift → persistent halt</text>

    <rect x="676" y="466" width="232" height="98" rx="13" class="guardBox"/>
    <text x="696" y="493" class="label">Risk gate</text>
    <text x="696" y="516" class="body">equity · buying power · daily P/L</text>
    <text x="696" y="538" class="body">order risk · positions · orders</text>
    <text x="696" y="557" class="tiny">any failed invariant → no entry</text>
  </g>

  <g>
    <rect x="964" y="122" width="428" height="476" rx="20" class="column"/>
    <text x="986" y="154" class="cap" fill="#c4b5fd">EXECUTION ROUTES</text>

    <rect x="988" y="178" width="380" height="170" rx="16" class="optionBox"/>
    <text x="1010" y="208" class="label">OPTIONS  ·  Alpaca</text>
    <text x="1010" y="236" class="body">ES → SPY    NQ → QQQ</text>
    <text x="1010" y="260" class="body">translate DOL → fetch chain → select</text>
    <text x="1010" y="284" class="body">high delta · debit spread · 0DTE</text>
    <text x="1010" y="312" class="tiny">single/multi-leg order + synthetic exits</text>
    <rect x="1250" y="198" width="94" height="34" rx="17" fill="#4c1d95" stroke="#c4b5fd"/>
    <text x="1297" y="220" class="tiny" text-anchor="middle" fill="#ede9fe">SPY / QQQ</text>

    <rect x="988" y="372" width="380" height="170" rx="16" class="futureBox"/>
    <text x="1010" y="402" class="label">FUTURES  ·  Tradovate</text>
    <text x="1010" y="430" class="body">explicit ES / NQ contract mapping</text>
    <text x="1010" y="454" class="body">quantity and signal-age validation</text>
    <text x="1010" y="478" class="body">market entry + native target / stop</text>
    <text x="1010" y="506" class="tiny">broker-hosted OSO/OCO protection</text>
    <rect x="1250" y="392" width="94" height="34" rx="17" fill="#0c4a6e" stroke="#38bdf8"/>
    <text x="1297" y="414" class="tiny" text-anchor="middle" fill="#e0f2fe">ES / NQ</text>
  </g>

  <path d="M258 216 H334" class="line"/>
  <path d="M258 310 C292 310 292 219 334 219" class="line"/>
  <path d="M465 260 V286" class="cyanLine"/>
  <path d="M465 462 V488" class="cyanLine"/>
  <path d="M596 526 H628 V214 H676" class="cyanLine"/>
  <path d="M792 250 V270" class="line"/>
  <path d="M792 342 V362" class="line"/>
  <path d="M792 446 V466" class="line"/>
  <path d="M908 515 C940 515 948 263 988 263" class="line"/>
  <path d="M908 515 C940 515 948 457 988 457" class="line"/>
  <path d="M258 404 C610 404 620 306 676 306" class="dash"/>
  <path d="M258 498 C612 498 618 306 676 306" class="dash"/>

  <g>
    <rect x="48" y="632" width="1344" height="120" rx="20" class="plane"/>
    <text x="70" y="663" class="cap" fill="#f8fafc">PERSISTENT OPERATIONS AND SAFETY PLANE</text>

    <rect x="70" y="682" width="255" height="48" rx="12" class="box"/>
    <text x="88" y="704" class="label">ExecutionStore</text>
    <text x="88" y="721" class="tiny">tracked trades + kill switch survive restart</text>

    <rect x="348" y="682" width="255" height="48" rx="12" class="box"/>
    <text x="366" y="704" class="label">Reconciliation loop</text>
    <text x="366" y="721" class="tiny">local intent ↔ broker-authoritative state</text>

    <rect x="626" y="682" width="255" height="48" rx="12" class="box"/>
    <text x="644" y="704" class="label">Operator dashboard</text>
    <text x="644" y="721" class="tiny">health · events · halt · flatten · release</text>

    <rect x="904" y="682" width="222" height="48" rx="12" class="guardBox"/>
    <text x="922" y="704" class="label">Fail closed</text>
    <text x="922" y="721" class="tiny">errors block new entries</text>

    <rect x="1149" y="682" width="219" height="48" rx="12" fill="#32151a" stroke="#fb7185" stroke-width="1.5"/>
    <text x="1167" y="704" class="label">Paper first</text>
    <text x="1167" y="721" class="tiny">live requires two explicit opt-ins</text>
  </g>

  <path d="M792 564 V632" class="dash"/>
  <path d="M1178 542 V632" class="dash"/>
</svg>
