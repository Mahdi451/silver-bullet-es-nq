<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Bullish Silver Bullet setup</title>
  <desc id="desc">Minimal bullish setup chart with upside target, stop, two fair value gaps, and entry marker.</desc>
  <defs>
    <style>
      .bg{fill:#0b1120}
      .panel{fill:#111827;stroke:#243244;stroke-width:1.5}
      .header{fill:#151f2e}
      .grid{stroke:#223047;stroke-width:1}
      .axis{stroke:#334155;stroke-width:1.5}
      .wick{stroke:#64748b;stroke-width:2;stroke-linecap:round}
      .up{fill:#22c55e}
      .down{fill:#ef4444}
      .text{fill:#f8fafc;font-family:Arial,sans-serif}
      .muted{fill:#94a3b8;font-family:Arial,sans-serif}
    </style>
  </defs>
  <rect width="1200" height="560" class="bg"/>
  <rect x="70" y="54" width="1060" height="430" rx="24" class="panel"/>
  <rect x="70" y="54" width="1060" height="52" rx="24" class="header"/>
  <text x="98" y="87" class="text" font-size="18" font-weight="700">Bullish Silver Bullet Setup</text>
  <text x="1098" y="87" class="muted" font-size="13" text-anchor="end">target above, stop below</text>

  <g>
    <line x1="112" y1="165" x2="1056" y2="165" class="grid"/>
    <line x1="112" y1="245" x2="1056" y2="245" class="grid"/>
    <line x1="112" y1="325" x2="1056" y2="325" class="grid"/>
    <line x1="112" y1="405" x2="1056" y2="405" class="grid"/>
    <line x1="112" y1="125" x2="112" y2="442" class="axis"/>
    <line x1="112" y1="442" x2="1056" y2="442" class="axis"/>
  </g>

  <g stroke-dasharray="8 7" stroke-width="2">
    <line x1="112" y1="150" x2="1056" y2="150" stroke="#38bdf8"/>
    <line x1="112" y1="412" x2="1056" y2="412" stroke="#ef4444"/>
  </g>
  <rect x="985" y="128" width="94" height="30" rx="8" fill="#0e7490"/>
  <text x="1032" y="148" fill="#ecfeff" font-family="Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle">TARGET</text>
  <rect x="985" y="390" width="94" height="30" rx="8" fill="#991b1b"/>
  <text x="1032" y="410" fill="#fee2e2" font-family="Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle">STOP</text>

  <g>
    <line x1="170" y1="352" x2="170" y2="414" class="wick"/><rect x="160" y="372" width="20" height="26" rx="3" class="down"/>
    <line x1="230" y1="330" x2="230" y2="392" class="wick"/><rect x="220" y="350" width="20" height="28" rx="3" class="up"/>
    <line x1="290" y1="338" x2="290" y2="406" class="wick"/><rect x="280" y="356" width="20" height="32" rx="3" class="down"/>
    <line x1="350" y1="310" x2="350" y2="376" class="wick"/><rect x="340" y="330" width="20" height="28" rx="3" class="up"/>
    <line x1="410" y1="286" x2="410" y2="354" class="wick"/><rect x="400" y="304" width="20" height="34" rx="3" class="up"/>
    <line x1="470" y1="226" x2="470" y2="330" class="wick"/><rect x="460" y="248" width="20" height="58" rx="3" class="up"/>
    <line x1="530" y1="204" x2="530" y2="292" class="wick"/><rect x="520" y="226" width="20" height="42" rx="3" class="up"/>
    <line x1="590" y1="246" x2="590" y2="332" class="wick"/><rect x="580" y="268" width="20" height="40" rx="3" class="down"/>
    <line x1="650" y1="226" x2="650" y2="312" class="wick"/><rect x="640" y="250" width="20" height="38" rx="3" class="up"/>
    <line x1="710" y1="194" x2="710" y2="272" class="wick"/><rect x="700" y="214" width="20" height="38" rx="3" class="up"/>
    <line x1="770" y1="174" x2="770" y2="246" class="wick"/><rect x="760" y="192" width="20" height="36" rx="3" class="up"/>
    <line x1="830" y1="156" x2="830" y2="226" class="wick"/><rect x="820" y="176" width="20" height="32" rx="3" class="up"/>
  </g>

  <rect x="456" y="306" width="98" height="34" rx="8" fill="#16a34a" opacity="0.22" stroke="#22c55e" stroke-width="1.5"/>
  <text x="505" y="363" fill="#86efac" font-family="Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle">FVG 1</text>
  <rect x="638" y="286" width="98" height="34" rx="8" fill="#16a34a" opacity="0.22" stroke="#22c55e" stroke-width="1.5"/>
  <text x="687" y="343" fill="#86efac" font-family="Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle">FVG 2</text>

  <line x1="742" y1="205" x2="742" y2="412" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4 6"/>
  <circle cx="742" cy="205" r="7" fill="#fbbf24"/>
  <rect x="758" y="188" width="72" height="32" rx="8" fill="#713f12"/>
  <text x="794" y="209" fill="#fef3c7" font-family="Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle">ENTRY</text>
</svg>
