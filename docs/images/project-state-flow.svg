<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc">
  <title id="title">Silver Bullet research flow</title>
  <desc id="desc">Concise architecture flow from historical data to strategy, signal, context gate, and paper-first proxy preview.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
    <style>
      .bg{fill:#0b1120}
      .panel{fill:#111827;stroke:#243244;stroke-width:1.5}
      .box{fill:#0f172a;stroke:#334155;stroke-width:1.5}
      .muted{fill:#94a3b8;font-family:Arial,sans-serif}
      .text{fill:#f8fafc;font-family:Arial,sans-serif}
      .small{fill:#cbd5e1;font-family:Arial,sans-serif}
      .accent{stroke:#38bdf8}
      .ok{stroke:#22c55e}
      .gate{stroke:#f59e0b}
    </style>
  </defs>
  <rect width="1100" height="360" class="bg"/>
  <rect x="44" y="42" width="1012" height="268" rx="28" class="panel"/>

  <text x="76" y="90" class="text" font-size="30" font-weight="700">Implemented System Paths</text>
  <text x="76" y="120" class="muted" font-size="15">Research and guarded live execution share one deterministic strategy boundary.</text>

  <g>
    <rect x="76" y="165" width="150" height="86" rx="18" class="box accent"/>
    <text x="151" y="199" class="text" font-size="17" font-weight="700" text-anchor="middle">Data</text>
    <text x="151" y="225" class="small" font-size="13" text-anchor="middle">CSV + live bars</text>

    <rect x="280" y="165" width="150" height="86" rx="18" class="box ok"/>
    <text x="355" y="199" class="text" font-size="17" font-weight="700" text-anchor="middle">Strategy</text>
    <text x="355" y="225" class="small" font-size="13" text-anchor="middle">levels + FVGs</text>

    <rect x="484" y="165" width="150" height="86" rx="18" class="box"/>
    <text x="559" y="199" class="text" font-size="17" font-weight="700" text-anchor="middle">Signal</text>
    <text x="559" y="225" class="small" font-size="13" text-anchor="middle">timed intent</text>

    <rect x="688" y="165" width="150" height="86" rx="18" class="box gate"/>
    <text x="763" y="199" class="text" font-size="17" font-weight="700" text-anchor="middle">Context</text>
    <text x="763" y="225" class="small" font-size="13" text-anchor="middle">SPY / QQQ gate</text>

    <rect x="892" y="165" width="132" height="86" rx="18" class="box"/>
    <text x="958" y="199" class="text" font-size="17" font-weight="700" text-anchor="middle">Route</text>
    <text x="958" y="225" class="small" font-size="13" text-anchor="middle">options / futures</text>
  </g>

  <g stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M226 208 H280"/>
    <path d="M430 208 H484"/>
    <path d="M634 208 H688"/>
    <path d="M838 208 H892"/>
  </g>

  <line x1="660" y1="144" x2="660" y2="272" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 7"/>
  <text x="682" y="285" class="muted" font-size="13">guarded provider and broker boundary</text>
  <text x="76" y="285" class="muted" font-size="13">Backtests and live operation retain deterministic signals and persistent safety state.</text>
</svg>
